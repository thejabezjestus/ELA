<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
     <title> CONTACT US </title>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
         <a href="./index.html" class="navbar-brand d-flex align-items-center">
            <!-- Resize the logo using Bootstrap utility classes -->
            <img src="./elysium-concept-3-diamond.png" alt="Logo" class="img-fluid" style="max-height: 75px; filter: brightness(1) invert(7);">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="./index.html"> <strong> HOME</strong></a></li>
              <li class="nav-item"><a class="nav-link" href="./about.html"><strong>ABOUT US</strong></a></li>
              <li class="nav-item"><a class="nav-link" href="./products.html"> <strong>SERVICES</strong></a></li>
              <li class="nav-item"><a class="nav-link" href="./contact.html">  <strong>CONTACT</strong> </a></li>
            </ul>
        </div>
    </nav>

    <!-- Contact Form Section -->
<section class="position-relative" style="min-height: 100vh;">

    <!-- Full-screen background image -->
    <div class="position-absolute w-100 h-100"
         style="top: 0; left: 0;
                background: url('./photorealistic-lawyer-environment.jpg') center/cover no-repeat;"></div>

    <!-- Dark overlay so the text and form stay readable -->
    <div class="position-absolute w-100 h-100"
         style="top: 0; left: 0; background: rgba(0, 0, 0, 0.45);"></div>

    <!-- Content on top of the image -->
    <div class="container position-relative py-5">
        <h1 class="text-center text-white font-weight-bold mb-4">Contact Us</h1>

        <form class="row justify-content-center">
            <div class="col-lg-6 col-md-8 col-12 rounded p-4 shadow"
                 style="background: rgba(0, 0, 0, 0.75); border: 1px solid #E3A857;">
                <div class="form-group">
                    <input type="text" id="firstName" class="form-control" placeholder="Enter your first name">
                </div>
                <div class="form-group">
                    <input type="text" id="lastName" class="form-control" placeholder="Enter your last name">
                </div>
                <div class="form-group">
                    <input type="tel" id="mobile" class="form-control" placeholder="Enter your mobile number">
                </div>
                <div class="form-group">
                    <textarea id="message" class="form-control" rows="5" placeholder="Write your message here"></textarea>
                </div>
                <button type="submit" class="btn btn-warning btn-block font-weight-bold">Submit</button>
            </div>
        </form>

        <div class="text-center text-white mt-5">
            <hr style="border-color: rgba(255,255,255,0.3);">
            <h5>Address</h5>
            <p class="mb-0">
                30, 02, Dhaniyabagicha Town Block,<br>
                Nagmatia Colony, Chhotki, Gaya-823002, Bihar
            </p>
        </div>
    </div>
</section>
    <!-- Footer -->
   <footer class="bg-dark text-white text-center py-3">
            <p>© 2026 ELYSIUM LEGAL ADVISORS. All Rights Reserved</p>
        </div>
    </footer>

    <!-- Bootstrap and JS -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="./data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2LcG6TT3QIcvheF0IoHkzCfKPlI+SlJzMO9C0H62k2" crossorigin="anonymous"></script>
</body>
</html>
